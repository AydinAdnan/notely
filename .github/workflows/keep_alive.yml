name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"   # runs every 10 minutes
  workflow_dispatch:         # allows manual run

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Server
        run: |
          echo "Pinging ${{ secrets.RENDER_BACKEND_URL }}/health"
          curl --fail --silent --show-error "${{ secrets.RENDER_BACKEND_URL }}/health"
