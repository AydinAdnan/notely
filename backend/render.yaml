services:
  - type: web
    name: notesapp-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
